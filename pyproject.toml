[project]
name = "3dprints"
version = "0.1.0"
description = "Parametric CadQuery models for 3D printing: pill case and bathroom sink organizer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cadquery==2.8.0",
]

[dependency-groups]
dev = [
    "gmsh==4.15.2",
    "pyamg==5.4.1",
    "pytest==9.1.1",
    "scikit-fem==12.0.2",
]

# Scripts only: there is no package to build or install
[tool.uv]
package = false
